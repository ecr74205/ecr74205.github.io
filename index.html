<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Class Change</title>
  </head>
  <body>
      <a id="link1" href="#">Click Here</a>
      <p id="p1">I change color</p>
    <script> 
     // This script changes the paragraph text color to yellow
  // and changes the background color of the page
  // when the user clicks the link
        const link1 = document.querySelector('#link1');
link1.onmouseup = () => {        document.querySelector('#p1').style.color='yellow';
document.body.style.backgroundColor = 'lightblue';
};
    </script>
  </body>
</html>
